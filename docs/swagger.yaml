      description:
        type: string
      priorityId:
        type: integer
      statusId:
        type: integer
      teamId:
        type: integer
      title:
        type: string
      userId:
        type: integer
    type: object
  web.UpdateStatusRequest:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      isFinal:
        type: boolean
      name:
        type: string
      sort:
        type: integer
    required:
    - code
    - description
    - id
    - isFinal
    - name
    - sort
    type: object
  web.UpdateUserRequest:
    properties:
      email:
