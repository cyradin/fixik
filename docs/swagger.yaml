    required:
    - email
    - id
    - name
    - role
    - username
    type: object
host: localhost:8080
info:
  contact: {}
  description: Incident management system API
  title: Fixik API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with username and password
      parameters:
      - description: Login data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/web.AuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Sets access and refresh cookies
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout by clearing access and refresh cookies
      produces:
      - application/json
      responses:
        "200":
          description: Clears cookies
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh access and refresh tokens using refresh cookie
      produces:
      - application/json
      responses:
        "200":
          description: Sets new access and refresh cookies
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      summary: Refresh
      tags:
      - auth
  /incidents:
    get:
      consumes:
      - application/json
      description: Get all incidents with pagination
      parameters:
      - default: 100
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
