basePath: /api
definitions:
  web.AuthLoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  web.CreateDictEntityRequest:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
      sort:
        type: integer
    required:
    - code
    - description
    - name
    - sort
    type: object
  web.CreateIncidentRequest:
    properties:
      authorId:
        type: integer
      description:
        type: string
      priorityId:
        type: integer
      statusId:
        type: integer
      teamId:
        type: integer
      title:
        type: string
      userId:
        type: integer
    required:
    - description
    - priorityId
    - statusId
    - title
    type: object
  web.CreateStatusRequest:
    properties:
      code:
        type: string
      description:
        type: string
      isFinal:
        type: boolean
      name:
        type: string
      sort:
        type: integer
    required:
    - code
    - description
    - isFinal
    - name
    - sort
    type: object
  web.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        enum:
        - admin
        - manager
        - user
        type: string
      teamId:
        type: integer
      username:
        type: string
    required:
    - email
    - name
    - password
    - role
    - username
    type: object
  web.DictEntity:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      sort:
        type: integer
    required:
    - code
    - description
    - id
    - name
    - sort
    type: object
  web.DictEntityShort:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    required:
    - code
    - id
    - name
    type: object
  web.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  web.IncidentListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/web.IncidentResponse'
        type: array
      pagination:
        $ref: '#/definitions/web.Pagination'
    required:
    - items
    - pagination
    type: object
  web.IncidentResponse:
    properties:
      author:
        $ref: '#/definitions/web.UserResponse'
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      priority:
        $ref: '#/definitions/web.DictEntityShort'
      status:
        $ref: '#/definitions/web.DictEntityShort'
      team:
        $ref: '#/definitions/web.DictEntityShort'
      title:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/web.UserResponse'
    required:
    - createdAt
    - description
    - id
    - priority
    - status
    - title
    - updatedAt
    type: object
  web.ListDictEntitiesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/web.DictEntity'
        type: array
    required:
    - items
    type: object
  web.ListRolesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/web.Role'
        type: array
    type: object
  web.ListStatusesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/web.Status'
        type: array
    required:
    - items
    type: object
  web.ListUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/web.UserResponse'
        type: array
    required:
    - items
    type: object
  web.Pagination:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    required:
    - limit
    - offset
    - total
    type: object
  web.Role:
    properties:
      code:
        enum:
        - admin
        - manager
        - user
        type: string
      description:
        type: string
      name:
        type: string
    required:
    - code
    - description
    - name
    type: object
  web.Status:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      isFinal:
        type: boolean
      name:
        type: string
      sort:
        type: integer
    required:
    - code
    - description
    - id
    - isFinal
    - name
    - sort
    type: object
  web.UpdateDictEntityRequest:
