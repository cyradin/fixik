          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: List statuses
      tags:
      - statuses
    post:
      consumes:
      - application/json
      description: Create new status dictionary entry
      parameters:
      - description: Status data
        in: body
        name: request
        required: true
