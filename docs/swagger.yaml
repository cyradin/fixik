      consumes:
      - application/json
      description: Delete status dictionary entry by ID
      parameters:
      - description: Status ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.ErrorResponse'
      summary: Delete status
      tags:
      - statuses
    get:
      consumes:
      - application/json
      description: Get status dictionary entry by ID
      parameters:
      - description: Status ID
        in: path
        name: id
        required: true
        type: integer
      produces:
